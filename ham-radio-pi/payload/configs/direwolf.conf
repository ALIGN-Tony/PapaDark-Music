# HamPi Direwolf template - copy to ~/direwolf.conf and set MYCALL.
# Direwolf is a software TNC: APRS position/weather beacons, AX.25 packet,
# and a KISS TNC for Xastir, Pat (packet Winlink), and APRS igating.

# REQUIRED: your callsign-SSID (e.g. N0CALL-7 for a portable station)
MYCALL N0CALL-7

# Soundcard: list devices with 'arecord -l' / 'aplay -l'.
# 'plughw:1,0' is typically the first USB sound device (DigiRig, Signalink...).
ADEVICE plughw:1,0
ACHANNELS 1

CHANNEL 0
# PTT via CAT (rigctld running on default port):
#PTT RIG 2 localhost:4532
# ...or via a serial line:
#PTT /dev/ttyUSB0 RTS
# ...or VOX (Signalink): leave PTT commented out.

MODEM 1200

# KISS TNC for client apps (Xastir, Pat): port 8001; AGW port 8000.
AGWPORT 8000
KISSPORT 8001

# APRS beacon once a GPS is attached via gpsd:
#GPSD
#TBEACON DELAY=1 EVERY=10 VIA=WIDE1-1,WIDE2-1 SYMBOL="/[" COMMENT="HamPi field station"
