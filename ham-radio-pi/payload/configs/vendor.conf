# RF Pi vendor configuration - controls the trial/license behavior.
# Enforcement only activates when /etc/hampi/vendor.pub exists (baked into
# the image from ham-radio-pi/vendor/vendor.pub; create with rfpi-keygen.py --init).

# Where the lock screen and trial banner send buyers.
PURCHASE_URL=

# Full-featured trial length in days from first boot (industry standard:
# 14-30; HRD gives 30).
TRIAL_DAYS=14

# Support / source-offer contact shown in the license documents.
CONTACT=
