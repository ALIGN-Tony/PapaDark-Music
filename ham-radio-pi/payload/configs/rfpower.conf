# RF Pi inline RF power / SWR meter (see RF-POWER.md for the wiring).
# Enable the background service:  sudo touch /etc/hampi/rfpower.enabled
#                                 sudo systemctl start hampi-rfpower

# --- ADS1115 I2C ADC ---
I2C_BUS=1
ADS_ADDR=0x48          # ADS1115 default (ADDR->GND). INA219 battery mon is 0x40.
ADS_GAIN=1             # 1 = +/-4.096 V full scale (recommended for log detectors)
FWD_CHANNEL=0          # ADS1115 A0 = forward detector output
REV_CHANNEL=1          # A1 = reflected detector; set -1 for power-only (no SWR)

# --- Calibration ---
# Best accuracy: run 'hampi-rfpower --cal <watts>' at two known powers into a
# dummy load; that writes /etc/hampi/rfpower.cal and overrides the values below.
# Until then, these approximate an AD8307 detector plus the chain gain:
SLOPE_DB_PER_V=40.0    # detector transfer (AD8307 ~= 25 mV/dB -> 40 dB/V)
OFFSET_DBM=-84.0       # detector intercept
COUPLER_DB=30.0        # directional-coupler coupling value
PAD_DB=20.0            # external attenuator after the coupled port

# --- Alerts (background service) ---
SWR_WARN=2.0           # amber above this
SWR_ALERT=3.0          # wall + syslog alert above this
TX_FLOOR_W=0.5         # forward power below this = idle / no carrier
