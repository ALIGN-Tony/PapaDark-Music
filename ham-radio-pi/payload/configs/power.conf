# HamPi battery monitor configuration (see 'hampi-power --help' for wiring).
# Enable the background monitor with:  sudo touch /etc/hampi/power.enabled
#                                      sudo systemctl start hampi-power

# Sensor type: ina219 (external shunt) or ina260 (integrated shunt)
SENSOR=ina219
I2C_BUS=1
I2C_ADDR=0x40
# INA219 only - shunt resistor value in ohms (stock modules: 0.1)
SHUNT_OHMS=0.1

# Battery chemistry: lifepo4 or leadacid
CHEMISTRY=lifepo4
# Series cells: 4 = 12V-class LiFePO4, 6 = 12V lead-acid
CELLS=4

# Optional overrides for alert thresholds (whole-pack volts).
# Defaults: LiFePO4 warn 12.80/crit 12.00; lead-acid warn 11.82/crit 11.58.
WARN_VOLTS=
CUTOFF_VOLTS=
