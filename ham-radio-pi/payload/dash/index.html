<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RF π — K4DIA</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logo.png">
</head>
<body>

<header id="topbar">
  <div id="brand"><img src="logo.png" alt=""><span class="rf">RF π</span>
    <span id="brand-call" hidden></span></div>
  <div id="clock"><span id="clock-utc">--:--:--</span><small>UTC</small></div>
  <div id="chips">
    <span class="chip" id="chip-gps"  title="GPS fix">GPS ?</span>
    <span class="chip" id="chip-sync" title="Clock sync (FT8 needs this)">SYNC ?</span>
    <span class="chip" id="chip-batt" title="Station battery">BATT ?</span>
    <span class="chip" id="chip-kb"   title="Active keyboard">KB ?</span>
  </div>
  <div id="topbtns">
    <button class="tbtn" id="btn-kbtoggle" title="Show/hide on-screen keyboard">⌨</button>
    <button class="tbtn" id="btn-night" title="Night (red) mode">🌙</button>
    <button class="tbtn" id="btn-full" title="Full screen">⛶</button>
    <button class="tbtn primary" id="btn-widgets">＋ Widgets</button>
  </div>
</header>

<main id="desk"></main>

<div id="launcher" hidden>
  <div id="launcher-box">
    <h2>RF π Widgets <button class="tbtn" id="launcher-close">✕</button></h2>
    <div id="launcher-grid"></div>
    <p class="hint">Drag a widget by its title bar. Drag the ◢ corner to resize.
       Layouts are saved per device — your phone and the tablet each keep their own.</p>
  </div>
</div>

<div id="osk" hidden></div>

<script src="app.js"></script>
</body>
</html>
